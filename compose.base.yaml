volumes:
  prometheus-data:
  tempo-data:
  grafana-storage:
  loki-storage:

services:
  fed-postgres:
    image: "postgres:18"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fed

  fed-collector:
    image: "otel/opentelemetry-collector:0.154.0"
    command: "--config=/etc/otel-collector.yaml"
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro

  fed-loki-init:
    image: "busybox:1.37.0"
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/var/loki"]
    volumes:
      - loki-storage:/var/loki

  fed-loki:
    image: "grafana/loki:3.7.0"
    user: "10001:10001"
    command: "-config.file=/etc/loki/config.yaml -target=all"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-storage:/var/loki
    depends_on:
      fed-collector:
        condition: service_started
      fed-loki-init:
        condition: service_completed_successfully
  fed-grafana:
    image: grafana/grafana-enterprise:13.0.3
    container_name: fed-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    volumes:
      - ./grafana.yml:/etc/grafana/provisioning/datasources/all.yml
      - grafana-storage:/var/lib/grafana
    depends_on:
      - fed-prometheus
      - fed-tempo
      - fed-loki
  fed-prometheus:
    image: prom/prometheus:v3.13.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/var/prometheus
    depends_on:
      - fed-collector
  fed-tempo:
    image: "grafana/tempo:3.0.2"
    command: "-target=all -config.file=/etc/tempo.yaml"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    depends_on:
      - fed-collector

  fed-s3:
    image: rustfs/rustfs:latest
    # default password: rustfsadmin
    volumes:
      - rustfs-storage:/data
