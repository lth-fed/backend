[package]
name = "transactions"
version = "0.1.0"
edition = "2024"

[dependencies]
base64.workspace = true
bin-common = { path = "../bin-common" }
clap.workspace = true
color-eyre.workspace = true
dashmap = "6.2.1"
dotenvy.workspace = true
ed25519-dalek.workspace = true
fed-auth-verifier = { path = "../fed-auth-verifier" }
jsonwebtoken.workspace = true
minilith-errors = { version = "0.1.0", path = "../minilith-errors", features = ["sqlx"] }
opentelemetry.workspace = true
poem.workspace = true
poem-openapi.workspace = true
reqwest = { workspace = true, features = ["form", "multipart", "query"] }
rustls = { version = "0.23.43", features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sumup = { version = "0.7.0", default-features = false, features = ["jiff", "reqwest-rustls-tls"] }
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
typst.workspace = true
typst-kit.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
uuid.workspace = true

[dev-dependencies]
poem = { workspace = true, features = ["test"] }

[lints]
workspace = true
