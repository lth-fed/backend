apiVersion: 1

datasources:
- name: prometheus
  type: prometheus
  url: http://localhost:9090
  isDefault: true
  access: proxy
  editable: true
- name: loki
  type: loki
  url: http://localhost:3100
  access: proxy
  jsonData:
    derivedFields:
      - name: TraceID
        # matcherRegex: '"trace_id":"([a-f0-9]+)"'
        matcherType: label
        matcherRegex: "trace_id"
        datasourceUid: tempo
        url: '$${__value.raw}'
    timeout: 60
    maxLines: 1000
- name: tempo
  type: tempo
  url: http://localhost:3200
  jsonData:
    tracesToLogsV2:
      datasourceUid: loki

      filterByTraceID: true
      filterBySpanID: true

      spanStartTimeShift: "-5s"
      spanEndTimeShift: "5s"

      tags:
        - key: service.name
          value: service_name

    tracesToMetrics:
      datasourceUid: prometheus

      tags:
        - key: service.name
          value: service
        - key: http.route
          value: route
        - key: http.response.status_code
          value: status

      # queries:
      #   - name: Request Rate
      #     query: |
      #       sum(rate(poem_requests_count{
      #         service="$${service}"
      #       }[5m]))
      #
      #   - name: Errors
      #     query: |
      #       sum(rate(poem_errors_count{
      #         service="$${service}",
      #         status=~"5.."
      #       }[5m]))

    serviceMap:
      datasourceUid: prometheus

    search:
      hide: false
    timeout: 60
    maxLines: 1000
