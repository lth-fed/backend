name: Publish GHCR images
on:
  workflow_run:
    workflows: ['Cargo Build & Test']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CONTAINER_ENGINE: docker
      CONTAINER_REGISTRY: ghcr.io/lth-fed
      CONTAINER_TAG: ${{ github.event.workflow_run.head_sha }}
      GIT_VERSION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./build-push.sh
  notify-hosting:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOSTING_DISPATCH_TOKEN }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Submit successful build to hosting
        run: |
          jq -n --arg repository 'backend' --arg revision "$SOURCE_SHA" \
            '{event_type:"images-published",client_payload:{repository:$repository,revision:$revision}}' > event.json
          gh api --method POST repos/lth-fed/hosting/dispatches --input event.json
