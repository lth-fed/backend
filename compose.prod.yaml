name: fed-production

include:
  - compose.base.yaml

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

services:
  # TODO: eventually replace with host-hosted Postgres, it's suboptimal to have it in a container.
  fed-postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the shell or a Compose env file}
    volumes:
      - ${POSTGRES_MOUNTPOINT:-/fed/postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  fed-collector:
    restart: unless-stopped

  fed-loki:
    restart: unless-stopped

  fed-prometheus:
    restart: unless-stopped

  fed-tempo:
    restart: unless-stopped

  fed-grafana:
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the shell or a Compose env file}
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.fed-grafana.rule: Host(`${GRAFANA_DOMAIN:-grafana.teknologappen.se}`)
      traefik.http.routers.fed-grafana.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.fed-grafana.tls: "true"
      traefik.http.routers.fed-grafana.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.fed-grafana.loadbalancer.server.port: "3000"

  fed-auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: fed-auth
    image: ${CONTAINER_REGISTRY:-localhost}/fed-auth:${CONTAINER_TAG:-production}
    restart: unless-stopped
    expose:
      - "8051"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.fed-auth.rule: Host(`${FED_AUTH_DOMAIN:-api.auth.teknologappen.se}`)
      traefik.http.routers.fed-auth.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.fed-auth.tls: "true"
      traefik.http.routers.fed-auth.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.fed-auth.loadbalancer.server.port: "8051"
      traefik.http.services.fed-auth.loadbalancer.server.scheme: https
    env_file:
      - ./fed-auth/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@fed-postgres:5432/auth
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fed-collector:4317
    depends_on:
      fed-postgres:
        condition: service_healthy
      fed-collector:
        condition: service_started

  transactions:
    build:
      context: .
      dockerfile: Dockerfile
      target: transactions
    image: ${CONTAINER_REGISTRY:-localhost}/transactions:${CONTAINER_TAG:-production}
    restart: unless-stopped
    expose:
      - "8052"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.transactions.rule: Host(`${TRANSACTIONS_DOMAIN:-transactions.teknologappen.se}`)
      traefik.http.routers.transactions.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.transactions.tls: "true"
      traefik.http.routers.transactions.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.transactions.loadbalancer.server.port: "8052"
      traefik.http.services.transactions.loadbalancer.server.scheme: https
    env_file:
      - ./transactions/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@fed-postgres:5432/transactions
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fed-collector:4317
    depends_on:
      fed-postgres:
        condition: service_healthy
      fed-collector:
        condition: service_started

  minilith:
    build:
      context: .
      dockerfile: Dockerfile
      target: minilith
    image: ${CONTAINER_REGISTRY:-localhost}/minilith:${CONTAINER_TAG:-production}
    volumes:
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json
      - ./AuthKey.p8:/run/secrets/AuthKey.p8
    restart: unless-stopped
    expose:
      - "8050"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.minilith.rule: Host(`${MINILITH_DOMAIN:-api.teknologappen.se}`)
      traefik.http.routers.minilith.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.minilith.tls: "true"
      traefik.http.routers.minilith.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.minilith.loadbalancer.server.port: "8050"
      traefik.http.services.minilith.loadbalancer.server.scheme: https
    env_file:
      - ./minilith/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@fed-postgres:5432/fed
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fed-collector:4317
      S3_PUBLIC_URL: https://${S3_DOMAIN:-s3.teknologappen.se}/image
    depends_on:
      fed-postgres:
        condition: service_healthy
      fed-collector:
        condition: service_started
      fed-auth:
        condition: service_started
      transactions:
        condition: service_started
      fed-s3:
        condition: service_started

  fed-s3:
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in the shell or a Compose env file}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in the shell or a Compose env file}
    expose:
      - "9000"
      - "9001"
    volumes:
      - ${RUSTFS_MOUNTPOINT:-/fed/s3}:/data
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.fed-s3.rule: Host(`${S3_DOMAIN:-s3.teknologappen.se}`)
      traefik.http.routers.fed-s3.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.fed-s3.tls: "true"
      traefik.http.routers.fed-s3.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.fed-s3.service: "fed-s3"
      traefik.http.routers.fed-s3.middlewares: "fed-s3-cors@docker"
      traefik.http.services.fed-s3.loadbalancer.server.port: "9000"
      traefik.http.middlewares.fed-s3-cors.headers.accesscontrolalloworiginlist: "https://app.teknologappen.se,https://admin.teknologappen.se"
      traefik.http.middlewares.fed-s3-cors.headers.accesscontrolallowmethods: "GET,HEAD,PUT,POST,DELETE,OPTIONS"
      traefik.http.middlewares.fed-s3-cors.headers.accesscontrolallowheaders: "*"
      traefik.http.middlewares.fed-s3-cors.headers.accesscontrolexposeheaders: "ETag"
      traefik.http.middlewares.fed-s3-cors.headers.accesscontrolmaxage: "86400"
      traefik.http.middlewares.fed-s3-cors.headers.addvaryheader: "true"
      #
      traefik.http.routers.fed-s3-console.rule: Host(`${S3_ADMIN_DOMAIN:-s3-console.teknologappen.se}`)
      traefik.http.routers.fed-s3-console.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.fed-s3-console.tls: "true"
      traefik.http.routers.fed-s3-console.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.fed-s3-console.service: "fed-s3-console"
      traefik.http.services.fed-s3-console.loadbalancer.server.port: "9001"

  memos:
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    # ports:
    #   - "5230:5230"
    expose:
      - "5230"
    volumes:
      - ./memos-data:/var/opt/memos
    environment:
      MEMOS_PORT: 5230
      MEMOS_DRIVER: sqlite
      MEMOS_INSTANCE_URL: https://<url>
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.services.memos.loadbalancer.server.port: 5230
      traefik.docker.network: traefik
      traefik.http.routers.memos-public.rule: Host(`memos.teknologappen.se`)
      traefik.http.routers.memos-public.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.fed-s3-console.tls: "true"
      traefik.http.routers.fed-s3-console.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.memos-public.service: memos
      traefik.http.routers.memos-public.middlewares: https-redirect@file
