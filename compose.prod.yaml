# Cross-repository deployment now belongs to https://github.com/lth-fed/hosting.
# On Esek this runs ONLY the telemetry stack behind the existing Traefik.
# Check out hosting next to backend, then use:
# docker compose --env-file ../hosting/telemetry/.env -f compose.prod.yaml up -d
# Fly applications, PostgreSQL and image storage are configured in hosting/fly/.
include:
  - path: ../hosting/telemetry/compose.yaml
    project_directory: ../hosting/telemetry
