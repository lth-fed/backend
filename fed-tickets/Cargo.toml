[package]
name = "fed-tickets"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
dotenvy = "0.15.7"
poem = "3.1.12"
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1.52.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
